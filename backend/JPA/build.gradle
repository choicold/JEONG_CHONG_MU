plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'demo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-web'//resourceNotFound
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation("org.hibernate.orm:hibernate-community-dialects")//enum
	implementation 'org.json:json:20231013'//OcrService에 json
	implementation 'org.springframework.boot:spring-boot-starter-webflux'//임시
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'// AWS S3 연동을 위한 의존성 추가
}

tasks.named('test') {
	useJUnitPlatform()
}
