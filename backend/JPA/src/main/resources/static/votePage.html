<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정산 투표</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: 20px auto; background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1, h2 { color: #343a40; text-align: center; }
        .receipt-group { margin-bottom: 30px; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; }
        .receipt-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #007bff; }
        .receipt-image { max-width: 100%; border-radius: 4px; margin-bottom: 15px; }
        .item-list { list-style: none; padding: 0; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #e9ecef; }
        .item:last-child { border-bottom: none; }
        .item-details { flex-grow: 1; }
        .item-name { font-weight: 500; }
        .item-price { color: #495057; }
        .vote-options label { cursor: pointer; padding: 8px 15px; border: 1px solid #ced4da; border-radius: 20px; transition: all 0.2s; }
        .vote-options input[type="radio"] { display: none; }
        .vote-options input[type="radio"]:checked + label { background-color: #007bff; color: white; border-color: #007bff; }
        .submit-container { text-align: center; margin-top: 30px; }
        #submit-vote-btn { padding: 12px 30px; font-size: 1.1rem; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #name-entry-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 8px; text-align: center; }
        .modal-content input { padding: 10px; width: 80%; margin-bottom: 20px; }
        .modal-content button { padding: 10px 20px; }
    </style>
</head>
<body>

<div id="name-entry-modal">
    <div class="modal-content">
        <h2>정산에 참여할 이름을 입력해주세요.</h2>
        <input type="text" id="participant-name-input" placeholder="예: 홍길동">
        <button id="start-vote-btn">투표 시작하기</button>
    </div>
</div>

<div class="container" id="vote-container" style="display:none;">
    <h1 id="settlement-title"></h1>
    <div id="receipts-container"></div> <div class="submit-container">
    <button id="submit-vote-btn">투표 완료하기</button>
</div>
</div>

<script>
    // ... (상단 변수 선언 및 이름 입력 모달 로직은 동일) ...
    let participantName = '';
    const settlementUuid = window.location.pathname.split('/').pop();
    const nameModal = document.getElementById('name-entry-modal');
    const nameInput = document.getElementById('participant-name-input');
    const startVoteBtn = document.getElementById('start-vote-btn');
    const voteContainer = document.getElementById('vote-container');

    startVoteBtn.addEventListener('click', async () => {
        participantName = nameInput.value.trim();
        if (!participantName) {
            alert('이름을 입력해주세요.');
            return;
        }
        nameModal.style.display = 'none';
        await loadVoteItems();
        voteContainer.style.display = 'block';
    });


    // ▼▼▼▼▼▼▼▼▼▼ [수정] 함수 전체 로직 변경 ▼▼▼▼▼▼▼▼▼▼
    async function loadVoteItems() {
        try {
            const response = await fetch(`/api/vote/${settlementUuid}`);
            if (!response.ok) throw new Error('정산 정보를 불러오는 데 실패했습니다.');

            const data = await response.json();

            document.getElementById('settlement-title').textContent = data.settlementTitle;
            const receiptsContainer = document.getElementById('receipts-container');
            receiptsContainer.innerHTML = ''; // 기존 내용 초기화

            // 영수증 그룹별로 반복
            data.receiptGroups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'receipt-group';

                // 영수증 헤더 (날짜, 총액)
                const header = document.createElement('div');
                header.className = 'receipt-header';
                header.innerHTML = `
                    <span>날짜: ${group.receiptDate}</span>
                    <span>총액: ${group.totalAmount.toLocaleString()}원</span>
                `;
                groupDiv.appendChild(header);

                // 영수증 이미지
                if (group.receiptImageUrl) {
                    const image = document.createElement('img');
                    image.src = group.receiptImageUrl;
                    image.className = 'receipt-image';
                    groupDiv.appendChild(image);
                }

                // 항목 리스트
                const itemList = document.createElement('ul');
                itemList.className = 'item-list';

                // 각 영수증에 속한 항목별로 반복
                group.items.forEach(item => {
                    const itemLi = document.createElement('li');
                    itemLi.className = 'item';
                    itemLi.innerHTML = `
                        <div class="item-details">
                            <div class="item-name">${item.itemName} (x${item.quantity})</div>
                            <div class="item-price">${item.itemPrice.toLocaleString()}원</div>
                        </div>
                        <div class="vote-options" data-item-id="${item.itemId}">
                            <input type="radio" id="attend-${item.itemId}" name="vote-${item.itemId}" value="true">
                            <label for="attend-${item.itemId}">참여</label>
                            <input type="radio" id="not-attend-${item.itemId}" name="vote-${item.itemId}" value="false" checked>
                            <label for="not-attend-${item.itemId}">미참여</label>
                        </div>
                    `;
                    itemList.appendChild(itemLi);
                });

                groupDiv.appendChild(itemList);
                receiptsContainer.appendChild(groupDiv);
            });

        } catch (error) {
            voteContainer.innerHTML = `<h1>${error.message}</h1>`;
        }
    }
    // ▲▲▲▲▲▲▲▲▲▲ [수정] 함수 전체 로직 변경 ▲▲▲▲▲▲▲▲▲▲


    // ... ('투표 완료하기' 버튼 이벤트 리스너는 동일) ...
    document.getElementById('submit-vote-btn').addEventListener('click', async (event) => {
        const submitButton = event.target;
        submitButton.disabled = true;
        submitButton.textContent = '처리 중...';

        const choices = [];
        document.querySelectorAll('.vote-options').forEach(div => {
            const itemId = parseInt(div.dataset.itemId, 10);
            const isParticipated = div.querySelector('input[type="radio"]:checked').value === 'true';
            choices.push({ itemId, isParticipated });
        });

        const requestBody = {
            participantName: participantName,
            choices: choices
        };

        try {
            const response = await fetch(`/api/vote/${settlementUuid}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const resultText = await response.text();
            if (!response.ok) throw new Error(resultText);

            alert(resultText);
            voteContainer.innerHTML = '<h1>투표해주셔서 감사합니다!</h1>';

        } catch (error) {
            alert(`오류 발생: ${error.message}`);
            submitButton.disabled = false;
            submitButton.textContent = '투표 완료하기';
        }
    });

</script>
</body>
</html>
